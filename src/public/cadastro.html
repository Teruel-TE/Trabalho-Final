<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - VerdeLab</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="back-home">← Voltar para a Loja</a>
            <h2>🧪 Criar Conta no VerdeLab</h2>
            
            <form id="cadastro-form">
                <!-- Dados de Login / Cliente -->
                <div class="form-group">
                    <label for="cadastro-nome">Nome Completo</label>
                    <input type="text" id="cadastro-nome" required placeholder="Seu nome completo">
                </div>
                
                <div class="form-group">
                    <label for="cadastro-email">E-mail</label>
                    <input type="email" id="cadastro-email" required placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label for="cadastro-password">Senha</label>
                    <input type="password" id="cadastro-password" required placeholder="******">
                </div>

                <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid var(--border-color);">
                <h3 style="font-size: 1.1rem; color: var(--primary-color); margin-bottom: 1rem;">Endereço de Entrega</h3>

                <!-- Campos correspondentes à tabela cadastro -->
                <div class="form-group">
                    <label for="cadastro-cep">CEP</label>
                    <input type="text" id="cadastro-cep" required placeholder="00000-000" maxlength="10">
                </div>

                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 2;">
                        <label for="cadastro-logradouro">Logradouro (Rua/Av.)</label>
                        <input type="text" id="cadastro-logradouro" required placeholder="Rua Exemplo">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="cadastro-numero">Número</label>
                        <input type="text" id="cadastro-numero" required placeholder="123">
                    </div>
                </div>

                <div class="form-group">
                    <label for="cadastro-bairro">Bairro</label>
                    <input type="text" id="cadastro-bairro" placeholder="Centro">
                </div>

                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 2;">
                        <label for="cadastro-cidade">Cidade</label>
                        <input type="text" id="cadastro-cidade" required placeholder="São Paulo">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="cadastro-estado">UF</label>
                        <input type="text" id="cadastro-estado" required placeholder="SP" maxlength="2" style="text-transform: uppercase;">
                    </div>
                </div>

                <button type="submit" class="btn-primary full-width">Cadastrar</button>
            </form>

            <p class="auth-redirect">Já tem uma conta? <a href="login.html">Faça login</a></p>
